[package]
name = "NueralArenaRS"
version = "0.0.1"
edition = "2024"

[dependencies]
input_method = "0.1.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[build]
rustflags = ["-C", "target-cpu=native"]
